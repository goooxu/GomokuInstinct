# InstinctNet 默认规模。
#
# 走「深而窄」有两条理由：
#   1. 对战时没有搜索，网络深度就是唯一的前瞻深度；
#   2. 实测这个尺度下推理是访存受限而非算力受限，吞吐几乎与通道数成反比 ——
#      128->192 通道吞吐掉到 0.63x，参数只涨 2.2x。而自博弈吞吐是全局瓶颈，
#      所以加宽很不划算，要加容量应该优先加层数。
model:
  name: instinct_net
  board_size: 15

  channels: 128
  blocks: 20

  # 方向卷积分支：沿 横/竖/主对角/副对角 的 depthwise 1-D 卷积。
  # 核长 9 = 五连窗口 ±4，一次覆盖一个点能参与的全部五连。
  line_kernel: 9

  # 逐点混合的中间维扩张比
  expansion: 1.0

  # 每隔 attn_every 个 block 插入一层**全盘**自注意力。
  # 原计划用轴向注意力（行/列/双对角），但 15x15 只有 225 个位置，
  # 全局注意力的开销与一个卷积块相当，实现更简单、表达力也更强，
  # 因此直接用全局的。
  attn_every: 4
  attn_heads: 4

  norm: rmsnorm
  activation: gelu

  # 全局门控（mean-pool -> MLP -> per-channel scale）的瓶颈压缩比
  se_ratio: 0.25

  # 输入平面数，与 gomoku_instinct/model/features.py 保持一致
  input_planes: 10
  history_planes: 4

heads:
  policy: true
  value: true           # 三分类：胜/负/和
  aux_threat: true      # 逐点棋型多标签（规则导出）
  aux_forbidden: true   # 逐点黑方禁手点预测（规则导出）
  aux_plies: true       # 剩余手数分桶
  aux_reply: true       # 对手应手分布（来自 MCTS）

loss_weights:
  policy: 1.0
  value: 1.0
  aux_threat: 0.3
  aux_forbidden: 0.6

  # 直接惩罚策略落在禁手点上的概率质量，**不随辅助权重衰减**。
  # 这不是"学个特征"，而是避免零搜索部署时的自杀：走上禁手点直接判负。
  # MCTS 目标虽已把禁手点压到接近 0，但那点质量在 225 个点里微不足道，
  # 交叉熵推不动 —— 实测策略变强后禁手告负率反而从 0.17% 涨到 6%，
  # 因为黑方"最凶"的着法往往正是三三、四四。
  policy_forbidden: 2.0
  aux_plies: 0.1
  aux_reply: 0.2
  # 辅助头是训练脚手架，后期按 schedule 衰减，避免占用主任务容量
  aux_decay_start_step: 200000
  aux_decay_end_step: 400000
  aux_decay_final_scale: 0.1
