# 4 卡节点上的训练编排。所有 null 项在启动时自动探测硬件填充。
run:
  run_dir: runs            # 相对工作目录
  run_id: null             # null = 自动生成；指定则续训该 run
  seed: 20260725

# ── 资源编排 ───────────────────────────────────────────────────────────────
# trainer 与 self-play actor 按 CPU socket 物理隔离，避免跨 socket 争抢内存带宽。
# actor 的 CPU 核范围取所绑 GPU 的 NUMA 亲和核集，启动时由 numactl 绑定。
resources:
  auto_detect: true        # 探测 GPU 数、CPU 核数、NUMA 亲和，校验下面的配置
  trainer:
    gpus: [0]              # 若 trainer 成为瓶颈，改成 [0, 1] 走 DDP
    cpu_workers: 16        # dataloader / 数据增强线程
  actors:
    - {gpu: 1, cpu_workers: null}
    - {gpu: 2, cpu_workers: null}
    - {gpu: 3, cpu_workers: null, run_arena: true}
  numa_bind: true

# ── 自博弈 ─────────────────────────────────────────────────────────────────
selfplay:
  games_in_flight: 2048    # 每个 actor 同时推进的对局数（喂饱 GPU 批量）
  eval_batch: 2048         # 送去 GPU 的定长批大小，用于 CUDA Graph 捕获
  cuda_graph: true

  mcts:
    sims: 400              # 教师强度；后期由 schedule 提到 800~1600
    c_puct: 1.6
    c_puct_base: 19652
    virtual_loss: 3
    dirichlet_alpha: 0.15  # 15x15 分支因子对应的经验取值
    dirichlet_eps: 0.25
    fpu_reduction: 0.25

    # playout cap randomization：少数手用满 sims 并产生训练目标，
    # 多数手用低 sims 只负责推进对局，显著提高单位算力下的目标产量
    full_search_prob: 0.25
    fast_sims: 100

  temperature:
    initial: 1.0
    moves: 16              # 前 16 手用 T=1 保证开局多样性
    final: 0.0

  resign:
    enabled: true
    threshold: -0.92
    # 保留一部分不认输的对局用于审计认输误判率，误判过高则自动收紧阈值
    audit_fraction: 0.05
    max_false_positive_rate: 0.02

  # 「部署分布自博弈」：这部分对局由零搜索策略执行落子，但训练目标仍由 MCTS 生成。
  # 目的是让 buffer 覆盖到部署时真正会走进去的局面，消除训练/部署分布漂移。
  deployment_distribution_fraction: 0.25

  mcts_sims_schedule:
    - {step: 0,      sims: 400}
    - {step: 300000, sims: 800}
    - {step: 800000, sims: 1600}

# ── Replay buffer ──────────────────────────────────────────────────────────
replay:
  capacity_positions: 4000000   # 滑动窗口，常驻内存
  min_positions_to_start: 50000
  shard_positions: 65536        # 每个落盘分片的局面数
  disk_keep_shards: 400         # 磁盘上保留的分片数，超出即回收
  symmetry_augment: true        # 8 重二面体对称（纯规则免费增强）

  # 失误挖掘：原始策略 argmax 与 MCTS 最优手价值差距大的局面加权过采样
  blunder_mining:
    enabled: true
    value_gap_threshold: 0.15
    oversample_weight: 4.0
    max_fraction_of_batch: 0.2

# ── 训练 ───────────────────────────────────────────────────────────────────
train:
  batch_size: 1024
  max_steps: 2000000
  compile: true                 # torch.compile 训练 step

  optim:
    name: bf16_adamw            # 主权重 BF16 + Kahan 补偿求和
    lr: 2.0e-3
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-4
    grad_clip: 1.0
    rounding: kahan             # kahan | stochastic | none（none 仅用于对照实验）
    moment_dtype: float32       # Adam 一/二阶矩精度；主权重仍为 BF16

  lr_schedule:
    warmup_steps: 2000
    schedule: cosine
    min_lr_scale: 0.05

  # 权重发布：actor 定期热加载，不做同步 generation 屏障
  publish_every_steps: 500

# ── 评测 ───────────────────────────────────────────────────────────────────
arena:
  # 晋级评测一律在零搜索模式下进行 —— 与部署条件一致，否则会优化错目标
  mode: raw_policy
  games: 400
  promote_winrate: 0.55
  eval_every_steps: 5000

  baselines:
    - random               # 随机合法落子
    - greedy_threat        # 规则基线：贪心连子 + 必防四三（非 AI，仅作绝对标尺）

  # 本项目的头号指标：同一份权重，零搜索 vs MCTS 的 Elo 差
  track_search_gap:
    enabled: true
    mcts_sims: 800
    games: 200
    every_steps: 20000

# ── 容灾 ───────────────────────────────────────────────────────────────────
checkpoint:
  # 按墙钟时间触发，把抢占/换机造成的损失控制在有界范围内
  every_seconds: 600
  every_steps: 10000
  keep_last: 10
  keep_best: 5
  atomic_write: true       # 先写 .tmp 再 rename

resume:
  auto: true               # 启动时自动检测最新 checkpoint 续训
  strict: true             # 配置与 checkpoint 不一致时报错而非静默忽略

logging:
  metrics_jsonl: true
  tensorboard: true
  log_every_steps: 50
  heartbeat_seconds: 30    # supervisor 据此检测死进程并重启
