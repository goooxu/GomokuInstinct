<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 348" width="700" height="348" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="348" fill="#fbfaf7"/>

  <text x="20" y="24" font-size="14" fill="#3a352e">BF16 砍掉的是尾数，不是指数 —— 范围没变，分辨率变粗了 64 倍</text>

  <!-- FP32 -->
  <text x="24" y="72" font-size="12.5" fill="#23201c" font-weight="600">FP32</text>
  <rect x="90" y="54" width="16" height="26" fill="#d9836f" stroke="#ffffff"/>
  <rect x="106" y="54" width="128" height="26" fill="#6f8ab0" stroke="#ffffff"/>
  <rect x="234" y="54" width="368" height="26" fill="#8fae88" stroke="#ffffff"/>
  <text x="98" y="98" font-size="10.5" fill="#8a8378" text-anchor="middle">符号</text>
  <text x="170" y="98" font-size="10.5" fill="#5a7398" text-anchor="middle">指数 8 位</text>
  <text x="418" y="98" font-size="10.5" fill="#4a6a44" text-anchor="middle">尾数 23 位</text>

  <!-- BF16 -->
  <text x="24" y="140" font-size="12.5" fill="#23201c" font-weight="600">BF16</text>
  <rect x="90" y="122" width="16" height="26" fill="#d9836f" stroke="#ffffff"/>
  <rect x="106" y="122" width="128" height="26" fill="#6f8ab0" stroke="#ffffff"/>
  <rect x="234" y="122" width="112" height="26" fill="#8fae88" stroke="#ffffff"/>
  <rect x="346" y="122" width="256" height="26" fill="none" stroke="#c9b0aa" stroke-dasharray="5 4"/>
  <text x="290" y="166" font-size="10.5" fill="#4a6a44" text-anchor="middle">尾数 7 位</text>
  <text x="474" y="166" font-size="10.5" fill="#a5392a" text-anchor="middle">砍掉的 16 位</text>
  <text x="170" y="166" font-size="10.5" fill="#5a7398" text-anchor="middle">指数照旧 8 位</text>

  <line x1="20" y1="188" x2="680" y2="188" stroke="#e2dbd0"/>

  <!-- 数轴 -->
  <text x="20" y="216" font-size="13" fill="#23201c" font-weight="600">1.0 附近，BF16 能表示的数只有这几个：</text>

  <line x1="120" y1="266" x2="640" y2="266" stroke="#8a8378" stroke-width="1.4"/>
  <g stroke="#8a8378" stroke-width="1.4">
    <line x1="140" y1="256" x2="140" y2="276"/>
    <line x1="380" y1="256" x2="380" y2="276"/>
    <line x1="620" y1="256" x2="620" y2="276"/>
  </g>
  <g font-size="11.5" fill="#3a352e" text-anchor="middle">
    <text x="140" y="296">1.0</text>
    <text x="380" y="296">1.0078</text>
    <text x="620" y="296">1.0156</text>
  </g>
  <path d="M140 240 H380" stroke="#6f8ab0" stroke-width="1.2" fill="none"/>
  <text x="260" y="234" font-size="11" fill="#5a7398" text-anchor="middle">一个 ULP = 2⁻⁷ ≈ 0.0078</text>
  <path d="M140 316 H380" stroke="#c9c2b6" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <text x="260" y="332" font-size="11" fill="#8a8378" text-anchor="middle">中间什么都没有</text>

  <!-- 更新量 -->
  <rect x="140" y="258" width="4" height="16" fill="#d43b26"/>
  <path d="M142 258 L142 226 L166 210" stroke="#d43b26" stroke-width="1.2" fill="none"/>
  <text x="172" y="208" font-size="11.5" fill="#a5392a">更新量 1e-4 只有一个 ULP 的 1.28%（图上约 4 像素）</text>
  <text x="172" y="224" font-size="11.5" fill="#a5392a" font-weight="600">→ 1.0 + 0.0001 舍回 1.0，加法完全没发生，且不报错</text>
</svg>
