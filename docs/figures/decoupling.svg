<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#fbfaf7"/>

  <text x="20" y="24" font-size="14" fill="#3a352e">训练侧的一切都在改善，而真正关心的那个指标一动不动</text>

  <!-- ── 左：训练侧 ── -->
  <text x="40" y="56" font-size="12.5" fill="#3f6b3a" font-weight="600">训练侧（拟合精度）</text>
  <line x1="48" y1="200" x2="312" y2="200" stroke="#8a8378" stroke-width="1.3"/>
  <line x1="48" y1="76" x2="48" y2="200" stroke="#8a8378" stroke-width="1.3"/>

  <polyline points="56,90 106,104 156,118 206,130 256,138 306,142"
            fill="none" stroke="#3f6b3a" stroke-width="2.4"/>
  <polyline points="56,188 106,178 156,170 206,163 256,157 306,152"
            fill="none" stroke="#6f8ab0" stroke-width="2.2"/>

  <text x="180" y="220" font-size="11" fill="#6b6459" text-anchor="middle">训练步数 →</text>

  <line x1="48" y1="238" x2="70" y2="238" stroke="#3f6b3a" stroke-width="2.4"/>
  <text x="78" y="242" font-size="11.5" fill="#3f6b3a">超出目标熵　+0.568 → +0.435　↓</text>
  <line x1="48" y1="258" x2="70" y2="258" stroke="#6f8ab0" stroke-width="2.2"/>
  <text x="78" y="262" font-size="11.5" fill="#5a7398">top1 一致率　62% → 70%　↑</text>

  <rect x="40" y="276" width="280" height="38" rx="5" fill="#eef3ea" stroke="#a8bfa0"/>
  <text x="54" y="292" font-size="11.5" fill="#3f6b3a">拟合越来越准，价值准确率同期</text>
  <text x="54" y="308" font-size="11.5" fill="#3f6b3a">也从 76% 升到 80.5%，威胁识别达 98%</text>

  <!-- 分隔 -->
  <line x1="350" y1="50" x2="350" y2="314" stroke="#e2dbd0"/>
  <circle cx="350" cy="140" r="17" fill="#fbfaf7"/>
  <text x="350" y="148" font-size="22" fill="#a5392a" text-anchor="middle">≠</text>

  <!-- ── 右：棋力侧 ── -->
  <text x="388" y="56" font-size="12.5" fill="#a5392a" font-weight="600">棋力侧（头号指标）</text>
  <line x1="396" y1="200" x2="660" y2="200" stroke="#8a8378" stroke-width="1.3"/>
  <line x1="396" y1="76" x2="396" y2="200" stroke="#8a8378" stroke-width="1.3"/>

  <line x1="470" y1="132" x2="654" y2="132" stroke="#c9c2b6" stroke-width="1" stroke-dasharray="4 3"/>
  <polyline points="404,182 434,158 470,134 510,130 550,129 600,131 650,129"
            fill="none" stroke="#d43b26" stroke-width="2.6"/>
  <g fill="#d43b26">
    <circle cx="404" cy="182" r="4"/><circle cx="510" cy="130" r="4"/><circle cx="650" cy="129" r="4"/>
  </g>
  <path d="M414 108 V168 L406 178" stroke="#e0a99e" stroke-width="1" fill="none"/>
  <text x="404" y="102" font-size="10.5" fill="#a5392a">起点 &lt; 2 次模拟</text>
  <text x="560" y="120" font-size="10.5" fill="#a5392a" text-anchor="middle">4 ~ 8 次模拟</text>
  <text x="562" y="160" font-size="11" fill="#8a8378" text-anchor="middle">这一段基本是平的</text>

  <text x="528" y="220" font-size="11" fill="#6b6459" text-anchor="middle">训练步数 →</text>

  <line x1="396" y1="238" x2="418" y2="238" stroke="#d43b26" stroke-width="2.6"/>
  <text x="426" y="242" font-size="11.5" fill="#a5392a">零搜索的等效搜索强度</text>

  <rect x="388" y="276" width="280" height="38" rx="5" fill="#fff6f4" stroke="#e8c9c2"/>
  <text x="402" y="292" font-size="11.5" fill="#a5392a">训练后期不再增长 —— 拟合更准</text>
  <text x="402" y="308" font-size="11.5" fill="#a5392a">没有转化为零搜索时更会下棋</text>

  <!-- 结论 -->
  <rect x="20" y="330" width="660" height="56" rx="6" fill="#f2f5f8" stroke="#dbe3ec"/>
  <text x="34" y="351" font-size="12.5" fill="#23201c" font-weight="600">解读：蒸馏访问分布，学到的是「教师最后选了哪里」，不是「教师为什么这样选」。</text>
  <text x="34" y="373" font-size="11.5" fill="#3a4a5a">MCTS 的强项是逐个验证候选手的后果，而这个验证发生在搜索<tspan font-weight="600">过程</tspan>里，不在最终分布的形状里。看得见威胁，却不会用威胁。</text>
</svg>
