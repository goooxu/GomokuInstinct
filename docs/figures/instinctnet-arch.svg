<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" width="720" height="452" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="452" fill="#fbfaf7"/>

  <text x="20" y="24" font-size="14" fill="#3a352e">InstinctNet：20 层 × 128 通道，4.44M 参数。主干全程 15×15 × 128，不下采样。</text>

  <!-- 主流程 -->
  <rect x="20" y="56" width="104" height="56" rx="6" fill="#dce7f2" stroke="#8aa5c4"/>
  <text x="72" y="80" font-size="12" fill="#23201c" text-anchor="middle">输入 10 平面</text>
  <text x="72" y="98" font-size="10.5" fill="#5a7398" text-anchor="middle">(B,10,15,15)</text>

  <path d="M128 84 H150" stroke="#8a8378" stroke-width="1.6" fill="none"/>
  <polygon points="158,84 148,79 148,89" fill="#8a8378"/>

  <rect x="162" y="56" width="86" height="56" rx="6" fill="#ffffff" stroke="#d8d2c6"/>
  <text x="205" y="80" font-size="12" fill="#23201c" text-anchor="middle">stem</text>
  <text x="205" y="98" font-size="10.5" fill="#8a8378" text-anchor="middle">3×3 → 128ch</text>

  <path d="M252 84 H274" stroke="#8a8378" stroke-width="1.6" fill="none"/>
  <polygon points="282,84 272,79 272,89" fill="#8a8378"/>

  <rect x="286" y="42" width="196" height="84" rx="6" fill="#eef3ea" stroke="#a8bfa0"/>
  <text x="384" y="64" font-size="12.5" fill="#23201c" text-anchor="middle" font-weight="600">主干</text>
  <text x="384" y="84" font-size="11.5" fill="#4a5a44" text-anchor="middle">DirectionalLineBlock × 20</text>
  <text x="384" y="102" font-size="11.5" fill="#4a5a44" text-anchor="middle">每 4 块后插一层全盘自注意力</text>
  <text x="384" y="118" font-size="11" fill="#7a8a72" text-anchor="middle">（第 4/8/12/16 块后，共 4 层）</text>

  <path d="M486 84 H508" stroke="#8a8378" stroke-width="1.6" fill="none"/>
  <polygon points="516,84 506,79 506,89" fill="#8a8378"/>

  <rect x="520" y="56" width="74" height="56" rx="6" fill="#ffffff" stroke="#d8d2c6"/>
  <text x="557" y="80" font-size="12" fill="#23201c" text-anchor="middle">RMSNorm</text>
  <text x="557" y="98" font-size="10.5" fill="#8a8378" text-anchor="middle">统计量 FP32</text>

  <!-- 头 -->
  <g stroke="#8a8378" stroke-width="1.3" fill="none">
    <path d="M598 84 H614 V30 H628"/><path d="M598 84 H614 V64 H628"/>
    <path d="M598 84 H614 V98 H628"/><path d="M598 84 H614 V132 H628"/>
    <path d="M598 84 H614 V166 H628"/><path d="M598 84 H614 V200 H628"/>
  </g>
  <g font-size="11">
    <rect x="628" y="16" width="74" height="26" rx="4" fill="#d8e4f2" stroke="#6f8ab0"/>
    <text x="665" y="33" fill="#23201c" text-anchor="middle">策略 225</text>
    <rect x="628" y="50" width="74" height="26" rx="4" fill="#d8e4f2" stroke="#6f8ab0"/>
    <text x="665" y="67" fill="#23201c" text-anchor="middle">价值 3</text>
    <rect x="628" y="84" width="74" height="26" rx="4" fill="#f0ece2" stroke="#c3b898"/>
    <text x="665" y="101" fill="#5a5348" text-anchor="middle">威胁 2×7×225</text>
    <rect x="628" y="118" width="74" height="26" rx="4" fill="#f0ece2" stroke="#c3b898"/>
    <text x="665" y="135" fill="#5a5348" text-anchor="middle">禁手 225</text>
    <rect x="628" y="152" width="74" height="26" rx="4" fill="#f0ece2" stroke="#c3b898"/>
    <text x="665" y="169" fill="#5a5348" text-anchor="middle">剩余手数 16</text>
    <rect x="628" y="186" width="74" height="26" rx="4" fill="#f0ece2" stroke="#c3b898"/>
    <text x="665" y="203" fill="#5a5348" text-anchor="middle">对手应手 225</text>
  </g>
  <text x="665" y="228" font-size="10.5" fill="#8a8378" text-anchor="middle">米色 = 辅助头</text>
  <text x="665" y="243" font-size="10.5" fill="#8a8378" text-anchor="middle">部署时不算</text>

  <line x1="20" y1="266" x2="700" y2="266" stroke="#e2dbd0"/>
  <text x="20" y="292" font-size="13" fill="#23201c" font-weight="600">展开一个 DirectionalLineBlock</text>

  <!-- block 内部 -->
  <text x="34" y="352" font-size="12" fill="#23201c">x</text>
  <path d="M44 348 H70" stroke="#8a8378" stroke-width="1.4" fill="none"/>
  <rect x="72" y="330" width="66" height="36" rx="5" fill="#ffffff" stroke="#d8d2c6"/>
  <text x="105" y="353" font-size="11" fill="#23201c" text-anchor="middle">RMSNorm</text>

  <path d="M140 348 H160 V324 H178" stroke="#8a8378" stroke-width="1.4" fill="none"/>
  <path d="M160 348 V372 H178" stroke="#8a8378" stroke-width="1.4" fill="none"/>
  <rect x="180" y="306" width="96" height="36" rx="5" fill="#eef3ea" stroke="#a8bfa0"/>
  <text x="228" y="329" font-size="11" fill="#23201c" text-anchor="middle">LineConv 四方向</text>
  <rect x="180" y="354" width="96" height="36" rx="5" fill="#eef3ea" stroke="#a8bfa0"/>
  <text x="228" y="377" font-size="11" fill="#23201c" text-anchor="middle">Conv 3×3 局部</text>

  <path d="M278 324 H296 V348" stroke="#8a8378" stroke-width="1.4" fill="none"/>
  <path d="M278 372 H296 V348" stroke="#8a8378" stroke-width="1.4" fill="none"/>
  <path d="M296 348 H316" stroke="#8a8378" stroke-width="1.4" fill="none"/>
  <text x="296" y="300" font-size="10.5" fill="#6b6459" text-anchor="middle">concat 2C</text>

  <rect x="318" y="330" width="118" height="36" rx="5" fill="#ffffff" stroke="#d8d2c6"/>
  <text x="377" y="347" font-size="11" fill="#23201c" text-anchor="middle">1×1 → GELU → 1×1</text>
  <text x="377" y="360" font-size="9.5" fill="#a5392a" text-anchor="middle">第二个 1×1 权重零初始化</text>

  <path d="M438 348 H458" stroke="#8a8378" stroke-width="1.4" fill="none"/>
  <rect x="460" y="330" width="92" height="36" rx="5" fill="#ffffff" stroke="#d8d2c6"/>
  <text x="506" y="353" font-size="11" fill="#23201c" text-anchor="middle">SqueezeExcite</text>

  <path d="M554 348 H580" stroke="#8a8378" stroke-width="1.4" fill="none"/>
  <circle cx="590" cy="348" r="11" fill="#ffffff" stroke="#8a8378" stroke-width="1.4"/>
  <text x="590" y="353" font-size="14" fill="#23201c" text-anchor="middle">+</text>
  <path d="M601 348 H628" stroke="#8a8378" stroke-width="1.4" fill="none"/>
  <polygon points="636,348 626,343 626,353" fill="#8a8378"/>
  <text x="654" y="352" font-size="12" fill="#23201c">out</text>

  <path d="M38 340 V308 H590 V337" fill="none" stroke="#b3aca0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="60" y="303" font-size="10.5" fill="#8a8378">残差</text>

  <text x="20" y="418" font-size="11.5" fill="#6b6459">第二个 1×1 零初始化 ⇒ 训练开始时残差分支恒为 0，整个块是恒等映射，20 层深网络才不会一上来就发散。</text>
  <text x="20" y="436" font-size="11.5" fill="#6b6459">注意力的输出投影用同样的技巧。</text>
</svg>
