<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="sans-serif">
  <rect x="0" y="0" width="680" height="300" fill="#fbfaf7"/>

  <text x="20" y="26" font-size="14" fill="#3a352e">「活三」的定义里套着「禁手」，而「禁手」的定义里又套着「活三」—— 判定必然递归。</text>

  <!-- 步骤 1 -->
  <rect x="20" y="46" width="190" height="118" rx="6" fill="#ffffff" stroke="#d8d2c6"/>
  <text x="115" y="68" font-size="12.5" fill="#6b6459" text-anchor="middle">① 盘面上有一个「三」</text>
  <line x1="40" y1="104" x2="190" y2="104" stroke="#c9c2b6"/>
  <circle cx="40"  cy="104" r="4"  fill="none" stroke="#b3aca0"/>
  <circle cx="65"  cy="104" r="4"  fill="none" stroke="#b3aca0"/>
  <circle cx="90"  cy="104" r="9"  fill="#1a1a1a"/>
  <circle cx="115" cy="104" r="9"  fill="#1a1a1a"/>
  <circle cx="140" cy="104" r="9"  fill="#1a1a1a"/>
  <circle cx="165" cy="104" r="4"  fill="none" stroke="#b3aca0"/>
  <circle cx="190" cy="104" r="4"  fill="none" stroke="#b3aca0"/>
  <text x="115" y="146" font-size="12" fill="#23201c" text-anchor="middle">它算活三吗？</text>

  <path d="M216 105 H240" stroke="#8a8378" stroke-width="1.6" fill="none"/>
  <polygon points="248,105 238,100 238,110" fill="#8a8378"/>

  <!-- 步骤 2 -->
  <rect x="254" y="46" width="190" height="118" rx="6" fill="#ffffff" stroke="#d8d2c6"/>
  <text x="349" y="68" font-size="12.5" fill="#6b6459" text-anchor="middle">② 试着补一子，看能否成活四</text>
  <line x1="274" y1="104" x2="424" y2="104" stroke="#c9c2b6"/>
  <circle cx="274" cy="104" r="4" fill="none" stroke="#b3aca0"/>
  <circle cx="299" cy="104" r="9" fill="#1a1a1a"/>
  <circle cx="324" cy="104" r="9" fill="#1a1a1a"/>
  <circle cx="349" cy="104" r="9" fill="#1a1a1a"/>
  <circle cx="374" cy="104" r="9" fill="#1a1a1a"/>
  <circle cx="399" cy="104" r="4" fill="none" stroke="#b3aca0"/>
  <circle cx="424" cy="104" r="4" fill="none" stroke="#b3aca0"/>
  <circle cx="299" cy="104" r="13" fill="none" stroke="#d43b26" stroke-width="2.2"/>
  <text x="349" y="146" font-size="12" fill="#3f6b3a" text-anchor="middle">成了活四 ✓</text>

  <path d="M450 105 H474" stroke="#8a8378" stroke-width="1.6" fill="none"/>
  <polygon points="482,105 472,100 472,110" fill="#8a8378"/>

  <!-- 步骤 3 -->
  <rect x="488" y="46" width="172" height="118" rx="6" fill="#fff6f4" stroke="#e8c9c2"/>
  <text x="574" y="68" font-size="12.5" fill="#6b6459" text-anchor="middle">③ 但补的那一手</text>
  <text x="574" y="88" font-size="13" fill="#a5392a" text-anchor="middle" font-weight="600">本身是不是禁手？</text>
  <text x="574" y="114" font-size="11.5" fill="#6b6459" text-anchor="middle">要判它是不是三三，</text>
  <text x="574" y="132" font-size="11.5" fill="#6b6459" text-anchor="middle">就得再判别的点</text>
  <text x="574" y="150" font-size="11.5" fill="#6b6459" text-anchor="middle">是不是活三……</text>

  <!-- 递归回边 -->
  <path d="M574 172 V196 H115 V174" fill="none" stroke="#a5392a" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polygon points="115,166 110,176 120,176" fill="#a5392a"/>
  <text x="344" y="214" font-size="12.5" fill="#a5392a" text-anchor="middle" font-weight="600">回到 ① 再判一次 —— 递归</text>

  <rect x="20" y="234" width="640" height="52" rx="6" fill="#f2f5f8" stroke="#dbe3ec"/>
  <text x="36" y="256" font-size="12.5" fill="#3a4a5a">递归一定会终止：每深一层都往盘上多放一颗子，棋盘是有限的。</text>
  <text x="36" y="276" font-size="12.5" fill="#3a4a5a">但深度只能实测 —— 最初上限拍了 8，被触发 4 次；加计数器后测得真实深度 11，遂改为 64 并要求封顶次数为 0。</text>
</svg>
