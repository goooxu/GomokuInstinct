<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 352" width="700" height="352" font-family="sans-serif">
  <rect x="0" y="0" width="700" height="352" fill="#fbfaf7"/>

  <text x="20" y="24" font-size="14" fill="#3a352e">一轮：1024 局各下潜一次 → 攒成一个定长批喂 GPU → 回填、退回根部</text>

  <!-- 左：并行对局 -->
  <rect x="24" y="52" width="126" height="188" rx="6" fill="#eef3ea" stroke="#a8bfa0"/>
  <text x="87" y="72" font-size="12" fill="#23201c" text-anchor="middle" font-weight="600">1024 局同时推进</text>
  <g fill="#ffffff" stroke="#a8bfa0">
    <rect x="38" y="84" width="98" height="26" rx="4"/>
    <rect x="38" y="116" width="98" height="26" rx="4"/>
    <rect x="38" y="148" width="98" height="26" rx="4"/>
    <rect x="38" y="196" width="98" height="26" rx="4"/>
  </g>
  <g font-size="11" fill="#4a5a44" text-anchor="middle">
    <text x="87" y="101">局 1　　树</text>
    <text x="87" y="133">局 2　　树</text>
    <text x="87" y="165">局 3　　树</text>
    <text x="87" y="188">⋮</text>
    <text x="87" y="213">局 1024　树</text>
  </g>

  <!-- collect -->
  <path d="M154 122 H214" stroke="#3f6b3a" stroke-width="1.8" fill="none"/>
  <polygon points="222,122 212,117 212,127" fill="#3f6b3a"/>
  <text x="188" y="108" font-size="11.5" fill="#3f6b3a" text-anchor="middle" font-weight="600">collect</text>
  <text x="188" y="146" font-size="10.5" fill="#5a5348" text-anchor="middle">每局各从根</text>
  <text x="188" y="160" font-size="10.5" fill="#5a5348" text-anchor="middle">下潜一次</text>

  <!-- 批 -->
  <rect x="228" y="60" width="120" height="172" rx="6" fill="#dce7f2" stroke="#6f8ab0"/>
  <text x="288" y="82" font-size="12" fill="#23201c" text-anchor="middle" font-weight="600">待评估的叶子</text>
  <g fill="#ffffff" stroke="#8aa5c4">
    <rect x="242" y="94" width="92" height="16"/><rect x="242" y="114" width="92" height="16"/>
    <rect x="242" y="134" width="92" height="16"/><rect x="242" y="154" width="92" height="16"/>
    <rect x="242" y="174" width="92" height="16"/>
  </g>
  <text x="288" y="212" font-size="11" fill="#5a7398" text-anchor="middle">(1024, 225) uint8</text>
  <text x="288" y="226" font-size="10.5" fill="#5a7398" text-anchor="middle">形状恒定</text>

  <!-- GPU -->
  <path d="M352 146 H400" stroke="#8a8378" stroke-width="1.8" fill="none"/>
  <polygon points="408,146 398,141 398,151" fill="#8a8378"/>
  <text x="378" y="134" font-size="10.5" fill="#6b6459" text-anchor="middle">encode</text>

  <rect x="414" y="86" width="176" height="120" rx="6" fill="#ffffff" stroke="#d8d2c6"/>
  <text x="502" y="110" font-size="12.5" fill="#23201c" text-anchor="middle" font-weight="600">一次网络前向</text>
  <text x="502" y="132" font-size="11" fill="#5a5348" text-anchor="middle">(1024, 10, 15, 15)</text>
  <text x="502" y="156" font-size="11" fill="#5a5348" text-anchor="middle">→ 策略 (1024, 225)</text>
  <text x="502" y="174" font-size="11" fill="#5a5348" text-anchor="middle">→ 价值 (1024,)</text>
  <text x="502" y="196" font-size="10.5" fill="#8a8378" text-anchor="middle">整轮 84.8% 的时间在这里</text>

  <!-- apply 回环 -->
  <path d="M502 210 V254 H87 V244" stroke="#a5642a" stroke-width="1.8" fill="none"/>
  <polygon points="87,236 82,246 92,246" fill="#a5642a"/>
  <text x="300" y="248" font-size="11.5" fill="#a5642a" text-anchor="middle" font-weight="600">apply：展开叶子、回传价值、退回根部；搜索次数够了就落子</text>

  <!-- 说明 -->
  <rect x="20" y="272" width="660" height="66" rx="6" fill="#f2f5f8" stroke="#dbe3ec"/>
  <text x="34" y="292" font-size="11.5" fill="#3a4a5a"><tspan font-weight="600">不需要 virtual loss</tspan> —— 每局每轮只下潜一次，同一棵树上没有并发下潜，PUCT 是精确的，不引入任何近似。</text>
  <text x="34" y="310" font-size="11.5" fill="#3a4a5a"><tspan font-weight="600">批大小恒定</tspan> —— 等于对局数。终局叶子不需要评估，但仍占位，保持形状不变（可被 CUDA Graph 捕获）。</text>
  <text x="34" y="328" font-size="11.5" fill="#3a4a5a"><tspan font-weight="600">下潜零拷贝</tspan> —— 直接在真实局面上落子，apply 后按记录深度逐手回退，不复制任何局面对象。</text>
</svg>
