<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gomoku-instinct</title>
<style>
  :root {
    --wood: #e3bd7c;
    --wood-edge: #c99b56;
    --line: #6b4a22;
    --ink: #23201c;
    --muted: #7b7369;
    --panel: #faf7f2;
    --border: #e2dbd0;
    --accent: #b3452e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f3efe8; color: var(--ink);
    font: 14px/1.6 system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
  }
  #app { display: flex; gap: 20px; padding: 16px; align-items: flex-start; }
  #boardWrap { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; }
  canvas { touch-action: manipulation; border-radius: 6px;
           box-shadow: 0 2px 12px rgba(0,0,0,.18); cursor: pointer; }
  canvas.readonly { cursor: default; }

  #panel { flex: 0 0 300px; background: var(--panel); border: 1px solid var(--border);
           border-radius: 8px; padding: 14px 16px; }

  /* 纵向排列。**不用 media query 拍一个断点** —— 该不该换向取决于"哪种排法棋盘更大"，
     而那要同时看窗口的宽和高，CSS 里算不出来。由 resize() 实测后加/去这个类。
     #panel 是 flex: 0 0 300px（不收缩），横着放不下时会把 #boardWrap 挤成负宽度，
     棋盘直接错乱，所以必须显式换向，光靠 flex 收缩救不回来。 */
  #app.stacked { flex-direction: column; align-items: stretch; }
  #app.stacked #panel { flex: 1 1 auto; width: 100%; }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  button, select {
    font: inherit; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--border);
    background: #fff; color: var(--ink); cursor: pointer;
  }
  button:hover:not(:disabled) { background: #f0ece5; }
  button:disabled { opacity: .45; cursor: default; }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: 13px;
              color: #4a453e; cursor: pointer; }

  #status { font-size: 15px; font-weight: 600; min-height: 1.6em; }
  #status.over { color: var(--accent); }
  #msg { color: var(--accent); font-size: 13px; min-height: 1.5em; }

  .sec { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; }
  .sec h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px;
            letter-spacing: .06em; }

  .bar { height: 8px; border-radius: 4px; background: #e6e1d8; position: relative;
         overflow: hidden; margin: 4px 0 2px; }
  .bar i { position: absolute; top: 0; bottom: 0; background: #55606e; }
  .barnum { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .cand { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 1px 0;
          font-variant-numeric: tabular-nums; }
  .cand b { width: 34px; font-weight: 600; }
  .cand .g { flex: 1; height: 6px; background: #e6e1d8; border-radius: 3px; }
  .cand .g i { display: block; height: 100%; background: #6f8ab0; border-radius: 3px; }
  .cand span { width: 40px; text-align: right; color: var(--muted); }

  #moves { max-height: 190px; overflow-y: auto; font-size: 13px;
           font-variant-numeric: tabular-nums; }
  #moves div { display: flex; gap: 6px; padding: 1px 0; }
  #moves b { width: 26px; color: var(--muted); font-weight: 400; text-align: right; }
  #moves a { flex: 1; cursor: pointer; padding: 0 4px; border-radius: 3px; color: var(--ink);
             text-decoration: none; }
  #moves a:hover { background: #ece7de; }
  #moves a.cur { background: #d9e3f0; font-weight: 600; }
  #moves a.bad { color: var(--accent); }
  #review { display: none; font-size: 13px; color: var(--accent); align-items: center;
            gap: 8px; margin-top: 6px; }
  .tip { font-size: 12px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <div id="boardWrap"><canvas id="board"></canvas></div>

  <div id="panel">
    <h1>gomoku-instinct</h1>
    <div class="sub" id="meta">载入中……</div>

    <div id="status"></div>
    <div id="msg"></div>

    <div class="row">
      <select id="mode" style="flex:1 1 auto; min-width:0">
        <option value="play">人机对战</option>
        <option value="watch">观战：模型互下</option>
      </select>
    </div>

    <div id="playPanel">
      <div class="row" id="modelRow" style="display:none">
        <select id="model" style="flex:1 1 auto; min-width:0"></select>
      </div>
      <div class="row">
        <select id="color">
          <option value="black">我执黑（先手）</option>
          <option value="white">我执白（后手）</option>
        </select>
        <button id="new">新局</button>
      </div>
    </div>

    <div id="watchPanel" style="display:none">
      <div class="row">
        <span style="width:2.4em">● 黑</span>
        <select id="mBlack" style="flex:1 1 auto; min-width:0"></select>
      </div>
      <div class="row">
        <span style="width:2.4em">○ 白</span>
        <select id="mWhite" style="flex:1 1 auto; min-width:0"></select>
      </div>
      <div class="row">
        <label class="chk" style="flex:1 1 auto; min-width:0">
          每手停
          <input type="range" id="pace" min="0" max="10" step="0.5" value="1.5"
                 style="flex:1 1 60px; min-width:60px">
          <span id="paceVal" style="width:3.4em; text-align:right">1.5s</span>
        </label>
      </div>
      <div class="row">
        <label class="chk" style="flex:1 1 auto; min-width:0">
          开局随机
          <input type="range" id="opening" min="0" max="8" step="1" value="2"
                 style="flex:1 1 60px; min-width:60px">
          <span id="openVal" style="width:3.4em; text-align:right">2 手</span>
        </label>
      </div>
      <div class="row">
        <label class="chk"><input type="checkbox" id="manual"> 手动逐手</label>
      </div>
      <div class="row">
        <button id="watchNew">开新局</button>
        <button id="stepBtn">走一手</button>
        <button id="pauseBtn">暂停</button>
      </div>
    </div>
    <div class="row">
      <button id="undo">悔棋</button>
      <button id="hint">提示</button>
      <button id="resign">认输</button>
    </div>
    <div class="row">
      <label class="chk" style="flex:1 1 auto; min-width:0">
        候选阈值 ≥
        <input type="range" id="thr" min="1" max="50" step="1" value="5"
               style="flex:1 1 70px; min-width:60px">
        <span id="thrVal" style="width:3.2em; text-align:right">5%</span>
      </label>
    </div>

    <div class="sec" id="evalSec" style="display:none">
      <h2 id="evalTitle">AI 自评</h2>
      <div class="bar"><i id="evalBar"></i></div>
      <div class="barnum" id="evalNum"></div>
      <div id="cands" style="margin-top:6px"></div>
    </div>

    <div class="sec">
      <h2>棋谱</h2>
      <div id="moves"></div>
      <div id="review"><span id="reviewTxt"></span><button id="toEnd">回到最新</button></div>
    </div>

    <div class="tip">
      模型是<b>每局各自选</b>的：新开一个标签页就是新的一局，
      两局可以用不同的模型同时下。刷新不会丢棋。<br>
      鼠标悬停会在落点上显示半透明的棋子、四边坐标同步高亮，确认后再点。<br>
      方向键也能移动落点，回车落子。<br>
      AI 落子后，那颗子上写着模型给这一手的概率，蓝圈是它同时在考虑的其它点 ——
      概率不低于「候选阈值」的全部会标出来，拖动滑杆可以调松调紧。
    </div>
  </div>
</div>

<script>
"use strict";

// ── 状态 ────────────────────────────────────────────────────────────────────
let S = null;            // 服务端返回的对局状态
let viewPly = null;      // 复盘中查看的手数；null 表示看最新局面
let hover = null;        // 鼠标/键盘指到的点
let pending = false;     // 有请求在飞
let px = 0, cell = 0;    // 画布边长与格距

const $ = (id) => document.getElementById(id);
const canvas = $("board"), ctx = canvas.getContext("2d");

// ── 与服务端通信 ────────────────────────────────────────────────────────────
async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json();
  if (res.status === 410) {
    // 会话没了（服务重启或被淘汰）。这里不能调 newGame()：它走 guard()，而此刻
    // pending 已经是 true，guard 会直接 return，新局根本开不出来，用户就卡死在
    // 一个已失效的对局上。直接请求并把新状态返回给调用方。
    const fresh = await fetch("/api/new", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ color: $("color").value, model: selectedModel() }),
    }).then((r) => r.json());
    $("msg").textContent = "上一局已失效（服务重启过），已为你开新局。";
    return fresh;
  }
  if (!res.ok) throw new Error(data.error || "请求失败");
  return data;
}

function setState(next) {
  S = next;
  viewPly = null;
  // sessionStorage 是**按标签页**隔离的：每个标签页记住自己那一局，
  // 刷新不会把棋丢掉，而新开一个标签页就是新的一局。
  // 用 localStorage 就错了 —— 所有标签页会共用同一个 sid，变成同一局。
  if (S && S.sid) sessionStorage.setItem("gi_sid", S.sid);
  render();
}

async function guard(fn) {
  if (pending) return;
  pending = true;
  $("msg").textContent = "";
  render();
  try {
    setState(await fn());
  } catch (err) {
    $("msg").textContent = err.message || String(err);
  } finally {
    pending = false;
    render();
  }
}

// 下拉框还没填好时按 0 号来，别把 NaN 发出去
const selectedModel = () => {
  const v = $("model").value;
  return v === "" || v === null ? 0 : Number(v);
};

const startGame = (color) =>
  guard(() => api("/api/new", { color, model: selectedModel() }));
const newGame = () => startGame($("color").value);

// ── 模型切换 ────────────────────────────────────────────────────────────────
let MODELS = [];

const modelLabel = (name, step, live) =>
  name +
  (step === null || step === undefined ? "" : "　step " + step.toLocaleString()) +
  (live ? "　⟳" : "");   // ⟳ 表示这个 run 是目录，会随 checkpoint 更新

function renderModels() {
  const row = $("modelRow"), sel = $("model");
  if (MODELS.length < 2) { row.style.display = "none"; return; }
  row.style.display = "flex";
  // 「哪个在用」和「练到哪一步」都取自同一份对局状态 S，两者不可能对不上。
  //
  // 这里**绝不能**把 S.step 写回 MODELS。激活模型是服务端全局状态，
  // MODELS 是另一次请求的快照，两边短暂不同步是常态；一旦写回去就留下永久脏值 ——
  // 实测表现是某个模型顶着另一个模型的步数显示，而且再也不会自己恢复。
  // 这正是 #11 号静默失败（render() 抹掉用户刚选的颜色）的同一个模式：
  // **render 只许读、不许写。**
  // 观战的两个下拉框独立于对局状态 —— 它们是「下一局用谁」的输入控件，
  // 所以只在选项集合变化时重建，绝不按 S 回写（#11 那条不变量）。
  for (const [id, seat] of [["mBlack", 1], ["mWhite", 2]]) {
    const el = $(id);
    if (el.options.length !== MODELS.length) {
      const keep = el.value;
      el.replaceChildren(...MODELS.map((m) => new Option(m.name, String(m.id))));
      if (keep !== "") el.value = keep;
      else if (S && S.seats && S.seats[seat]) el.value = String(S.seats[seat].id);
    }
  }

  const activeId = S && S.model ? S.model.id : -1;
  // 用 new Option 而不是拼 innerHTML —— 名字来自命令行给的路径，不该被当 HTML 解析。
  sel.replaceChildren(...MODELS.map((m) => {
    const step = (m.id === activeId && S) ? S.step : m.step;
    const o = new Option(modelLabel(m.name, step, m.live), String(m.id));
    o.selected = m.id === activeId;
    return o;
  }));
}

// ── 观战：模型互下 ──────────────────────────────────────────────────────────
//
// 服务端只提供「走一手」，节奏完全由这里定 —— 自动模式就是"走一手 → 等 N 秒 →
// 再走一手"，手动模式就是等按钮。两种模式共用同一条服务端接口，
// 服务端不需要知道界面用的哪种节奏。

let watchTimer = null;    // 待触发的下一手
let watchOn = false;      // 自动推进是否开着

const isWatch = () => $("mode").value === "watch";
const pace = () => Number($("pace").value) * 1000;

function stopWatch() {
  watchOn = false;
  if (watchTimer !== null) { clearTimeout(watchTimer); watchTimer = null; }
}

function scheduleNext() {
  if (watchTimer !== null) { clearTimeout(watchTimer); watchTimer = null; }
  if (!watchOn || $("manual").checked) return;
  if (!S || S.outcome !== "ongoing") { watchOn = false; return; }
  watchTimer = setTimeout(stepOnce, pace());
}

async function stepOnce() {
  watchTimer = null;
  if (!S || S.outcome !== "ongoing" || pending) return;
  await guard(() => api("/api/step", { sid: S.sid }));
  scheduleNext();
}

function newWatchGame() {
  stopWatch();
  guard(() => api("/api/new", {
    watch: {
      black: Number($("mBlack").value),
      white: Number($("mWhite").value),
      opening: Number($("opening").value),
    },
  })).then(() => {
    // 手动模式下开局就停在那儿，等你点「走一手」
    if (!$("manual").checked) { watchOn = true; scheduleNext(); }
  });
}

async function loadModels() {
  try {
    MODELS = (await fetch("/api/models").then((r) => r.json())).models || [];
  } catch (err) {
    MODELS = [];
  }
  renderModels();
}

// ── 绘制 ────────────────────────────────────────────────────────────────────
// 面板固定宽度 + 两侧 padding + 中间间距。改 CSS 时这里要跟着改。
const PANEL_W = 300, GAP = 20, APP_PAD = 32, VIEW_MARGIN = 34;

function resize() {
  if (!S) return;
  const app = $("app"), wrap = $("boardWrap");

  // 选哪种排法，标准只有一条：**哪种棋盘更大**。
  //
  // 左右排布时棋盘宽度要让出面板的 320px；上下排布时能用满整个宽度，
  // 但两种都不能超过一屏高（超了就得滚动才能看全棋盘）。
  // 于是：窗口够宽时高度才是瓶颈，两种排法棋盘一样大 —— 那就用左右排布，
  // 面板不用滚动就看得见；窗口一窄，宽度成为瓶颈，上下排布的棋盘更大，就换向。
  const total = app.clientWidth - APP_PAD;
  const heightCap = window.innerHeight - VIEW_MARGIN;
  const sideBySide = Math.min(total - PANEL_W - GAP, heightCap);
  const stacked = Math.min(total, heightCap);
  app.classList.toggle("stacked", stacked > sideBySide);

  // 换类会改变 #boardWrap 的宽度，必须重新量，不能用上面算的估计值。
  const avail = Math.min(wrap.clientWidth, heightCap);
  // **不能**把它抬到一个固定下限。原来写的是 Math.max(280, avail)：
  // 容器窄于 280px 时画布就比容器还宽，右边一列连同坐标直接被切掉。
  // 棋盘宁可小，也不能超出容器。
  px = Math.floor(Math.max(1, avail));
  cell = px / (S.size + 1);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = px * dpr;
  canvas.height = px * dpr;
  canvas.style.width = canvas.style.height = px + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

const cx = (c) => cell * (c + 1);
const cy = (r) => cell * (r + 1);
const colLabel = (c) => String.fromCharCode(65 + c);
const rowLabel = (r) => String(S.size - r);

// 复盘时按手数前缀重建局面，不必回服务端要
function shownGrid() {
  if (viewPly === null) return S.grid;
  const g = new Array(S.size * S.size).fill(0);
  for (let i = 0; i < viewPly; i++) g[S.history[i].move] = S.history[i].color;
  return g;
}
const shownLast = () =>
  viewPly === null ? S.last_move
  : viewPly > 0 ? S.history[viewPly - 1].move : null;

// 要在棋盘上标出来的候选点：最近一次分析里概率不低于阈值、且仍是空点的**全部**候选。
//
// AI 落子后 top[0] 正是它刚下的那手、已经有子，被空点过滤自然排除，
// 剩下的就是它同时还在考虑的点；轮到人按提示时，拿到的是它自己会走的那些。
//
// 阈值由页面上的滑杆定，纯客户端筛选：拖动立刻重画，不用回服务端。
// 服务端一次给够 100 个候选（见 ANALYSIS_TOP_K），所以阈值降到 1% 也不会被截断。
const pct = (p) => (p >= 0.005 ? Math.round(p * 100) + "%" : "<1%");

const threshold = () => Number($("thr").value) / 100;

function analysisMarks() {
  if (!S.analysis || viewPly !== null) return [];
  const grid = shownGrid();
  const t = threshold();
  return S.analysis.top.filter((cd) => grid[cd.move] === 0 && cd.prob >= t);
}

function drawStone(c, r, color, alpha) {
  const x = cx(c), y = cy(r), rad = cell * 0.455;
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  if (alpha === undefined) {
    ctx.shadowColor = "rgba(0,0,0,.35)";
    ctx.shadowBlur = cell * 0.14;
    ctx.shadowOffsetY = cell * 0.05;
  }
  const black = color === S.colors.black;
  const g = ctx.createRadialGradient(
    x - rad * 0.35, y - rad * 0.4, rad * 0.1, x, y, rad * 1.05);
  if (black) { g.addColorStop(0, "#6d6d6d"); g.addColorStop(1, "#0d0d0d"); }
  else { g.addColorStop(0, "#ffffff"); g.addColorStop(1, "#cdc7bd"); }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, rad, 0, Math.PI * 2);
  ctx.fill();
  if (!black) {
    ctx.shadowColor = "transparent";
    ctx.strokeStyle = "rgba(0,0,0,.22)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();
}

function draw() {
  if (!S) return;
  const N = S.size, grid = shownGrid(), last = shownLast();
  const readonly = viewPly !== null || !isMyTurn();

  // 木纹底
  const bg = ctx.createLinearGradient(0, 0, px, px);
  bg.addColorStop(0, "#eccf95");
  bg.addColorStop(1, "#d9ad6b");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, px, px);

  // 格线
  ctx.strokeStyle = "#6b4a22";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < N; i++) {
    const v = Math.round(cx(i)) + 0.5;
    ctx.moveTo(v, cy(0)); ctx.lineTo(v, cy(N - 1));
    const h = Math.round(cy(i)) + 0.5;
    ctx.moveTo(cx(0), h); ctx.lineTo(cx(N - 1), h);
  }
  ctx.stroke();
  ctx.lineWidth = 2;
  ctx.strokeRect(Math.round(cx(0)) + .5, Math.round(cy(0)) + .5,
                 Math.round(cx(N - 1) - cx(0)), Math.round(cy(N - 1) - cy(0)));

  // 星位
  if (N === 15) {
    ctx.fillStyle = "#5d3f1c";
    for (const [r, c] of [[3,3],[3,11],[11,3],[11,11],[7,7]]) {
      ctx.beginPath();
      ctx.arc(cx(c), cy(r), cell * 0.09, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 坐标：上下左右四边都标，减少来回找行列的眼动
  ctx.font = `${Math.round(cell * 0.4)}px system-ui, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const hc = hover === null ? -1 : hover % N;
  const hr = hover === null ? -1 : (hover - (hover % N)) / N;
  for (let i = 0; i < N; i++) {
    ctx.fillStyle = (i === hc && !readonly) ? "#a03a22" : "#7a5527";
    ctx.fillText(colLabel(i), cx(i), cell * 0.45);
    ctx.fillText(colLabel(i), cx(i), px - cell * 0.45);
    ctx.fillStyle = (i === hr && !readonly) ? "#a03a22" : "#7a5527";
    ctx.fillText(rowLabel(i), cell * 0.45, cy(i));
    ctx.fillText(rowLabel(i), px - cell * 0.45, cy(i));
  }

  // 禁手点
  if (S.forbidden && viewPly === null) {
    ctx.strokeStyle = "#c62828";
    ctx.lineWidth = Math.max(1.5, cell * 0.07);
    ctx.lineCap = "round";
    const d = cell * 0.2;
    for (let i = 0; i < S.forbidden.length; i++) {
      if (!S.forbidden[i] || grid[i] !== 0) continue;
      const c = i % N, r = (i - c) / N;
      ctx.beginPath();
      ctx.moveTo(cx(c) - d, cy(r) - d); ctx.lineTo(cx(c) + d, cy(r) + d);
      ctx.moveTo(cx(c) + d, cy(r) - d); ctx.lineTo(cx(c) - d, cy(r) + d);
      ctx.stroke();
    }
    ctx.lineCap = "butt";
  }

  // 模型同时在考虑的其它点（概率 ≥ 阈值），见 analysisMarks()
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `600 ${Math.round(cell * 0.3)}px system-ui, sans-serif`;
  for (const cd of analysisMarks()) {
    const c = cd.move % N, r = (cd.move - c) / N;
    ctx.beginPath();
    ctx.arc(cx(c), cy(r), cell * 0.42, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(58,110,190,0.13)";
    ctx.fill();
    ctx.strokeStyle = "rgba(38,86,160,0.55)";
    ctx.lineWidth = Math.max(1, cell * 0.045);
    ctx.setLineDash([cell * 0.12, cell * 0.1]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "rgba(24,64,124,0.55)";
    ctx.fillText(pct(cd.prob), cx(c), cy(r));
  }

  // 棋子
  for (let i = 0; i < grid.length; i++) {
    if (grid[i] === 0) continue;
    const c = i % N, r = (i - c) / N;
    drawStone(c, r, grid[i]);
  }

  // 模型选中这一手时给它自己的概率，标在那颗子上。
  // 按提示（analysis.move 还是空点）时不画 —— 那手还没下，它是候选不是落子。
  const played =
    S.analysis && viewPly === null && grid[S.analysis.move] !== 0 ? S.analysis : null;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  if (played !== null) {
    const c = played.move % N, r = (played.move - c) / N;
    ctx.font = `600 ${Math.round(cell * 0.3)}px system-ui, sans-serif`;
    ctx.fillStyle = grid[played.move] === S.colors.black ? "#e8e4dc" : "#2a2a2a";
    ctx.fillText(pct(played.move_prob), cx(c), cy(r));
  }

  // 随机开局落的子打个叉。**必须标出来** —— 那几手不是模型下的，
  // 不标的话你会对着一手随机落子琢磨"它为什么下这里"。
  if (S.opening > 0 && S.history) {
    ctx.strokeStyle = "rgba(120,120,120,0.9)";
    ctx.lineWidth = Math.max(1, cell * 0.045);
    ctx.lineCap = "round";
    const d = cell * 0.14;
    for (let k = 0; k < S.opening && k < S.history.length; k++) {
      const m = S.history[k].move;
      const c = m % N, r = (m - c) / N;
      ctx.strokeStyle = grid[m] === S.colors.black
        ? "rgba(232,228,220,0.85)" : "rgba(90,90,90,0.9)";
      ctx.beginPath();
      ctx.moveTo(cx(c) - d, cy(r) - d); ctx.lineTo(cx(c) + d, cy(r) + d);
      ctx.moveTo(cx(c) + d, cy(r) - d); ctx.lineTo(cx(c) - d, cy(r) + d);
      ctx.stroke();
    }
    ctx.lineCap = "butt";
  }

  // 最后一手：圈画在靠近子边缘处，好给中间的概率让出位置
  if (last !== null && last !== undefined && grid[last]) {
    const c = last % N, r = (last - c) / N;
    ctx.strokeStyle = "#d43b26";
    ctx.lineWidth = Math.max(1.5, cell * 0.05);
    ctx.beginPath();
    ctx.arc(cx(c), cy(r), cell * 0.37, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 悬停的幽灵子
  if (hover !== null && !readonly && grid[hover] === 0) {
    const c = hover % N, r = (hover - c) / N;
    drawStone(c, r, S.human, 0.42);
  }

  canvas.classList.toggle("readonly", readonly);
}

// ── 面板 ────────────────────────────────────────────────────────────────────
const isMyTurn = () =>
  S && S.outcome === "ongoing" && S.to_move === S.human && !pending;

// 观战局里"你"这个字没有指代对象 —— 两边都是模型，胜负要报模型名。
const seatName = (color) =>
  (S.seats && S.seats[color] && S.seats[color].name) || "?";

function statusText() {
  if (S.outcome !== "ongoing") {
    if (S.resigned !== null && S.resigned !== undefined) return "你认输了。";
    if (S.outcome === "draw") return "和棋。";
    const blackWon = S.outcome === "black_win";
    const bad = S.history.length && S.history[S.history.length - 1].forbidden;
    const why = bad ? "（禁手判负）" : "";
    const head = (blackWon ? "黑胜" : "白胜") + why + " —— ";
    if (S.watching) {
      return head + seatName(blackWon ? S.colors.black : S.colors.white) + " 赢了。";
    }
    const iWon = (blackWon ? S.colors.black : S.colors.white) === S.human;
    return head + (iWon ? "你赢了。" : "AI 赢了。");
  }
  if (S.watching) {
    const who = seatName(S.to_move) + (S.to_move === S.colors.black ? "（黑）" : "（白）");
    if (pending) return who + " 思考中……";
    return "轮到 " + who + "　" + (watchOn ? "自动推进中" : "已暂停");
  }
  if (pending) return "AI 思考中……";
  return S.to_move === S.human ? "轮到你了。" : "AI 思考中……";
}

function render() {
  if (!S) return;
  // 观战时两边可能是不同的模型（甚至同一个模型的不同步数），只报一个 step 会误导
  $("meta").textContent = S.watching
    ? `● ${seatName(S.colors.black)} @${S.seats[S.colors.black].step.toLocaleString()}`
      + `　vs　○ ${seatName(S.colors.white)} @${S.seats[S.colors.white].step.toLocaleString()}`
      + (S.opening > 0 ? `　开局 ${S.opening} 手随机（中央 5×5 内）` : "　无随机开局")
    : `权重 step ${S.step.toLocaleString()}　${S.size}×${S.size} 连珠禁手　零搜索`;
  // 切换失败时（比如两个模型棋盘尺寸不一样）下拉框要弹回真正生效的那个，
  // 否则页面显示的和实际在下棋的不是同一个模型。
  renderModels();
  // 这些都是 <span> 或 style，不是输入控件 —— 不违反"render 不得回写输入控件"那条。
  $("thrVal").textContent = $("thr").value + "%";
  $("paceVal").textContent = Number($("pace").value).toFixed(1) + "s";
  $("openVal").textContent = $("opening").value + " 手";
  const watching = !!(S && S.watching);
  $("playPanel").style.display = watching ? "none" : "";
  $("watchPanel").style.display = watching ? "" : "none";
  $("stepBtn").disabled = !watching || S.outcome !== "ongoing" || pending;
  $("pauseBtn").textContent = watchOn ? "暂停" : "继续";
  $("pauseBtn").disabled = !watching || $("manual").checked;
  $("status").textContent = statusText();
  $("status").classList.toggle("over", S.outcome !== "ongoing");

  const over = S.outcome !== "ongoing";
  $("undo").disabled = pending || !S.history.length;
  $("hint").disabled = pending || over;
  $("resign").disabled = pending || over;
  $("new").disabled = pending;
  // 注意：这里**不能**去写 $("color").value。它是"下一局用什么颜色"的输入控件，
  // 不是当前状态的显示。guard() 在发请求前会先 render() 一次，一旦在这里回写，
  // 用户刚选的颜色就会在被读到之前被抹掉 —— 表现为"永远开不出白棋局"。

  // 评估
  const a = S.analysis;
  $("evalSec").style.display = a ? "" : "none";
  if (a) {
    const side = a.value_color === S.colors.black ? "黑" : "白";
    const mine = a.value_color === S.human;
    $("evalTitle").textContent = mine ? `局面评估（${side}方，也就是你）`
                                      : `AI 自评（${side}方）`;
    const v = Math.max(-1, Math.min(1, a.value));
    const bar = $("evalBar");
    bar.style.left = (v >= 0 ? 50 : 50 + v * 50) + "%";
    bar.style.width = Math.abs(v) * 50 + "%";
    bar.style.background = v >= 0 ? "#4f7a4a" : "#a34a3c";
    $("evalNum").textContent =
      `${v >= 0 ? "+" : ""}${v.toFixed(3)}　（+1 表示${side}方必胜）`;
    // 侧栏列表用同一个阈值，和棋盘上的标记保持一致；
    // 一个都不到阈值时明说，别让人以为是坏了。
    const shown = a.top.filter((cd) => cd.prob >= threshold());
    $("cands").innerHTML = shown.length
      ? shown.map((cd) =>
          `<div class="cand"><b>${cd.label}</b>` +
          `<span class="g"><i style="width:${(cd.prob * 100).toFixed(0)}%"></i></span>` +
          `<span>${(cd.prob * 100).toFixed(1)}%</span></div>`).join("")
      : `<div class="cand" style="color:var(--muted)">没有概率 ≥ ` +
        `${$("thr").value}% 的候选</div>`;
  }

  // 棋谱
  const cur = viewPly === null ? S.history.length : viewPly;
  $("moves").innerHTML = S.history.map((h, i) =>
    `<div><b>${i + 1}</b><a data-ply="${i + 1}" ` +
    `class="${i + 1 === cur ? "cur" : ""} ${h.forbidden ? "bad" : ""}">` +
    `${h.color === S.colors.black ? "●" : "○"} ${h.label}` +
    `${h.forbidden ? " 禁手" : ""}</a></div>`).join("") ||
    `<div style="color:var(--muted)">还没落子</div>`;
  $("review").style.display = viewPly === null ? "none" : "flex";
  $("reviewTxt").textContent = viewPly === null ? "" : `复盘中：第 ${viewPly} 手`;

  draw();
}

// ── 交互 ────────────────────────────────────────────────────────────────────
function pointAt(ev) {
  const rect = canvas.getBoundingClientRect();
  const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
  const c = Math.round(x / cell - 1), r = Math.round(y / cell - 1);
  if (c < 0 || r < 0 || c >= S.size || r >= S.size) return null;
  // 离交叉点太远就不认，避免边缘误判成邻格
  if (Math.hypot(x - cx(c), y - cy(r)) > cell * 0.62) return null;
  return r * S.size + c;
}

canvas.addEventListener("pointermove", (ev) => {
  if (!S) return;
  const p = pointAt(ev);
  if (p !== hover) { hover = p; draw(); }
});
canvas.addEventListener("pointerleave", () => { hover = null; draw(); });

canvas.addEventListener("pointerdown", (ev) => {
  if (!S || !isMyTurn() || viewPly !== null) return;
  const p = pointAt(ev);
  if (p === null || S.grid[p] !== 0) return;
  hover = p;
  guard(() => api("/api/move", { sid: S.sid, move: p }));
});

// 键盘：方向键挪落点、回车落子 —— 15×15 上靠鼠标点准一个交叉点并不容易，
// 先挪光标再确认比点错了再悔棋省事
document.addEventListener("keydown", (ev) => {
  if (!S) return;
  const N = S.size;
  if (ev.key === "ArrowLeft" || ev.key === "ArrowRight" ||
      ev.key === "ArrowUp" || ev.key === "ArrowDown") {
    if (hover === null) hover = ((N >> 1) * N) + (N >> 1);
    else {
      let c = hover % N, r = (hover - c) / N;
      if (ev.key === "ArrowLeft") c = Math.max(0, c - 1);
      if (ev.key === "ArrowRight") c = Math.min(N - 1, c + 1);
      if (ev.key === "ArrowUp") r = Math.max(0, r - 1);
      if (ev.key === "ArrowDown") r = Math.min(N - 1, r + 1);
      hover = r * N + c;
    }
    ev.preventDefault();
    draw();
  } else if (ev.key === "Enter" && hover !== null && isMyTurn() && viewPly === null) {
    if (S.grid[hover] === 0) guard(() => api("/api/move", { sid: S.sid, move: hover }));
  } else if (ev.key === "Escape" && viewPly !== null) {
    viewPly = null; render();
  }
});

$("new").onclick = newGame;
$("color").onchange = () => {
  // 选颜色就是想用那个颜色下 —— 中途换色没有意义，直接开新局。已经落过子的先问一句。
  if (S && S.history.length &&
      !confirm("换颜色要重新开一局，当前这局就没了。继续？")) {
    $("color").value = S.human === S.colors.white ? "white" : "black";
    return;
  }
  newGame();
};
$("model").onchange = () => {
  const id = Number($("model").value);
  // 换模型**不重开对局** —— 摆着同一个局面换个对手来走，正是对比强弱最直接的用法。
  // 换模型**只影响这一局**，别的标签页照旧；也不重开对局 ——
  // 摆着同一个局面换个对手接着走，正是对比强弱最直接的用法。
  guard(() => api("/api/model", { sid: S.sid, id }));
};
$("mode").onchange = () => {
  stopWatch();
  if (isWatch()) newWatchGame();
  else newGame();
};
$("watchNew").onclick = newWatchGame;
$("stepBtn").onclick = () => { stopWatch(); stepOnce(); };
$("pauseBtn").onclick = () => {
  if (watchOn) stopWatch();
  else { watchOn = true; scheduleNext(); }
  render();
};
$("manual").onchange = () => {
  // 切到手动就把待触发的那一手取消掉，否则会"手动模式下自己又走了一步"
  if ($("manual").checked) stopWatch();
  else if (S && S.watching && S.outcome === "ongoing") { watchOn = true; scheduleNext(); }
  render();
};
$("opening").oninput = () => {
  localStorage.setItem("gi_opening", $("opening").value);
  render();   // 只更新旁边那个 <span>，下一局才生效
};
$("pace").oninput = () => {
  localStorage.setItem("gi_pace", $("pace").value);
  // 正在等的那一手按新节奏重排，不然改了要等下一手才生效
  if (watchOn) scheduleNext();
  render();
};
$("undo").onclick = () => guard(() => api("/api/undo", { sid: S.sid }));
$("hint").onclick = () => guard(() => api("/api/hint", { sid: S.sid }));
$("resign").onclick = () => guard(() => api("/api/resign", { sid: S.sid }));
$("thr").oninput = () => {
  // 只是显示口径变了，不用回服务端 —— 候选一次就取够了。
  // 注意：**不能**把这个值写进 render()，它是用户的输入控件，render 里回写
  // 就是 #11 号那个坑。启动时读一次 localStorage 就够了。
  localStorage.setItem("gi_thr", $("thr").value);
  render();
};
$("toEnd").onclick = () => { viewPly = null; render(); };
$("moves").onclick = (ev) => {
  const ply = ev.target.dataset && ev.target.dataset.ply;
  if (!ply) return;
  const n = Number(ply);
  viewPly = (viewPly === n) ? null : n;   // 再点一次回到最新
  render();
};
window.addEventListener("resize", resize);

// 候选阈值是显示口径，不属于某一局，用 localStorage 跨标签页共用。
// 只在这里写一次输入控件，render() 里绝不碰它。
const savedThr = localStorage.getItem("gi_thr");
if (savedThr) $("thr").value = savedThr;
const savedPace = localStorage.getItem("gi_pace");
if (savedPace) $("pace").value = savedPace;
const savedOpening = localStorage.getItem("gi_opening");
if (savedOpening !== null) $("opening").value = savedOpening;

// 刷新时先试着接回本标签页原来那一局，接不上再开新的。
async function boot() {
  const saved = sessionStorage.getItem("gi_sid");
  if (saved) {
    try {
      const st = await fetch("/api/state?sid=" + encodeURIComponent(saved))
        .then((r) => r.json());
      if (st && typeof st.step === "number") {
        setState(st);
        // 接回来的要是观战局，模式下拉框得跟着对齐 —— 否则面板显示的是观战，
        // 下拉框却写着"人机对战"。**只在这里写一次**，render() 里绝不碰
        // （#11 那条不变量：渲染不写输入控件）。接回的局不自动跑，
        // 刷新一下就自己动起来是很吓人的。
        if (st.watching) $("mode").value = "watch";
        return;
      }
    } catch (err) { /* 接不回来就当新局开 */ }
  }
  await newGame();
}

boot().then(() => { resize(); loadModels(); });
</script>
</body>
</html>
